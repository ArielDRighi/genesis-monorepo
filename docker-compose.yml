version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: genesis-monorepo-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-genesis_db}
    volumes:
      - genesis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-genesis_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:16-alpine
    container_name: genesis-testing-db
    restart: unless-stopped
    ports:
      - "5438:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: genesis_testing_db
    volumes:
      - genesis_postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d genesis_testing_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  genesis_postgres_data:
    name: genesis_postgres_data
  genesis_postgres_test_data:
    name: genesis_postgres_test_data
